<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b1020;
      --accent: #6d5efc;
      --accent-2: #00d4ff;
      --text: #e8ebf5;
      --muted: #9aa3c0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 70% -10%, rgba(109,94,252,0.35), transparent 60%),
                  radial-gradient(900px 500px at 10% 110%, rgba(0,212,255,0.25), transparent 55%),
                  var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .card {
      max-width: 720px;
      text-align: center;
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-2);
      border: 1px solid rgba(0,212,255,0.35);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    h1 .grad {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.lead {
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto 36px;
    }
    .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 600;
      padding: 14px 26px;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #0b1020;
      box-shadow: 0 10px 30px rgba(109,94,252,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(109,94,252,0.55); }
    .btn-ghost {
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .btn-ghost:hover { transform: translateY(-2px); background: rgba(255,255,255,0.06); }
    footer {
      position: fixed;
      bottom: 18px;
      left: 0; right: 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Próximamente</span>
    <h1>Construye algo <span class="grad">extraordinario</span></h1>
    <p class="lead">
      Esta es tu landing page. Edita este contenido para contar tu historia,
      presentar tu producto y convertir visitantes en clientes.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="#">Empezar ahora →</a>
      <a class="btn btn-ghost" href="#">Saber más</a>
    </div>
  </main>
  <footer>Hecho con ♥ · Desplegado en Vercel</footer>
</body>
</html>
